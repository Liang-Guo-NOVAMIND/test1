<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0d9b5;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
h1{margin:12px 0 4px;font-size:28px;color:#5a3e1b;letter-spacing:6px}
#status{margin:6px 0 10px;font-size:18px;color:#8b4513;min-height:26px;font-weight:bold}
#board-wrap{position:relative;background:#e8c882;border:3px solid #5a3e1b;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.3);padding:20px}
canvas{display:block;cursor:pointer}
#controls{margin:12px 0;display:flex;gap:12px}
button{padding:8px 24px;font-size:16px;border:2px solid #5a3e1b;border-radius:6px;background:#d4a656;color:#3a2510;cursor:pointer;font-weight:bold;transition:background .15s}
button:hover{background:#c4963f}
#history{margin-top:8px;font-size:13px;color:#5a3e1b;max-width:560px;text-align:center;min-height:20px}
</style>
</head>
<body>
<h1>中国象棋</h1>
<div id="status">红方先行</div>
<div id="board-wrap"><canvas id="board"></canvas></div>
<div id="controls">
  <button onclick="newGame()">新局</button>
  <button onclick="undoMove()">悔棋</button>
</div>
<div id="history"></div>
<script>
"use strict";

const COLS = 9, ROWS = 10;
const CELL = 58;
const PAD = 30;
const W = PAD * 2 + (COLS - 1) * CELL;
const H = PAD * 2 + (ROWS - 1) * CELL;
const PIECE_R = 24;

const RED = "red", BLACK = "black";

const PIECE_NAMES = {
  red:   { K:"帥", A:"仕", E:"相", H:"馬", R:"車", C:"炮", P:"兵" },
  black: { K:"將", A:"士", E:"象", H:"馬", R:"車", C:"炮", P:"卒" }
};

const INIT_PIECES = [
  { type:"R", color:RED,   col:0, row:9 },
  { type:"H", color:RED,   col:1, row:9 },
  { type:"E", color:RED,   col:2, row:9 },
  { type:"A", color:RED,   col:3, row:9 },
  { type:"K", color:RED,   col:4, row:9 },
  { type:"A", color:RED,   col:5, row:9 },
  { type:"E", color:RED,   col:6, row:9 },
  { type:"H", color:RED,   col:7, row:9 },
  { type:"R", color:RED,   col:8, row:9 },
  { type:"C", color:RED,   col:1, row:7 },
  { type:"C", color:RED,   col:7, row:7 },
  { type:"P", color:RED,   col:0, row:6 },
  { type:"P", color:RED,   col:2, row:6 },
  { type:"P", color:RED,   col:4, row:6 },
  { type:"P", color:RED,   col:6, row:6 },
  { type:"P", color:RED,   col:8, row:6 },
  { type:"R", color:BLACK, col:0, row:0 },
  { type:"H", color:BLACK, col:1, row:0 },
  { type:"E", color:BLACK, col:2, row:0 },
  { type:"A", color:BLACK, col:3, row:0 },
  { type:"K", color:BLACK, col:4, row:0 },
  { type:"A", color:BLACK, col:5, row:0 },
  { type:"E", color:BLACK, col:6, row:0 },
  { type:"H", color:BLACK, col:7, row:0 },
  { type:"R", color:BLACK, col:8, row:0 },
  { type:"C", color:BLACK, col:1, row:2 },
  { type:"C", color:BLACK, col:7, row:2 },
  { type:"P", color:BLACK, col:0, row:3 },
  { type:"P", color:BLACK, col:2, row:3 },
  { type:"P", color:BLACK, col:4, row:3 },
  { type:"P", color:BLACK, col:6, row:3 },
  { type:"P", color:BLACK, col:8, row:3 }
];

let pieces, turn, selected, validMoves, moveHistory, gameOver, inCheck;

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
canvas.width = W;
canvas.height = H;

function toPixel(col, row) {
  return { x: PAD + col * CELL, y: PAD + row * CELL };
}

function toBoard(px, py) {
  const col = Math.round((px - PAD) / CELL);
  const row = Math.round((py - PAD) / CELL);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
  const p = toPixel(col, row);
  if (Math.hypot(px - p.x, py - p.y) > PIECE_R + 4) return null;
  return { col, row };
}

function pieceAt(col, row, board) {
  board = board || pieces;
  return board.find(p => p.col === col && p.row === row);
}

function countBetweenOrth(c1, r1, c2, r2, board) {
  board = board || pieces;
  let cnt = 0;
  if (c1 === c2) {
    const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
    for (let r = minR + 1; r < maxR; r++) if (pieceAt(c1, r, board)) cnt++;
  } else if (r1 === r2) {
    const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
    for (let c = minC + 1; c < maxC; c++) if (pieceAt(c, r1, board)) cnt++;
  }
  return cnt;
}

function inPalace(col, row, color) {
  if (col < 3 || col > 5) return false;
  if (color === RED) return row >= 7 && row <= 9;
  return row >= 0 && row <= 2;
}

function ownHalf(row, color) {
  return color === RED ? row >= 5 : row <= 4;
}

function rawMoves(piece, board) {
  board = board || pieces;
  const { type, color, col, row } = piece;
  const moves = [];
  const enemy = color === RED ? BLACK : RED;

  switch (type) {
    case "K": {
      const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
      for (const [dc, dr] of dirs) {
        const nc = col + dc, nr = row + dr;
        if (inPalace(nc, nr, color)) {
          const t = pieceAt(nc, nr, board);
          if (!t || t.color === enemy) moves.push({ col: nc, row: nr });
        }
      }
      const opponentKing = board.find(p => p.type === "K" && p.color === enemy);
      if (opponentKing && opponentKing.col === col) {
        if (countBetweenOrth(col, row, opponentKing.col, opponentKing.row, board) === 0) {
          moves.push({ col: opponentKing.col, row: opponentKing.row });
        }
      }
      break;
    }
    case "A": {
      const dirs = [[1,1],[1,-1],[-1,1],[-1,-1]];
      for (const [dc, dr] of dirs) {
        const nc = col + dc, nr = row + dr;
        if (inPalace(nc, nr, color)) {
          const t = pieceAt(nc, nr, board);
          if (!t || t.color === enemy) moves.push({ col: nc, row: nr });
        }
      }
      break;
    }
    case "E": {
      const dirs = [[2,2],[2,-2],[-2,2],[-2,-2]];
      for (const [dc, dr] of dirs) {
        const nc = col + dc, nr = row + dr;
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
        if (!ownHalf(nr, color)) continue;
        const bc = col + dc / 2, br = row + dr / 2;
        if (pieceAt(bc, br, board)) continue;
        const t = pieceAt(nc, nr, board);
        if (!t || t.color === enemy) moves.push({ col: nc, row: nr });
      }
      break;
    }
    case "H": {
      const steps = [
        [1,0,2,1],[1,0,2,-1],[-1,0,-2,1],[-1,0,-2,-1],
        [0,1,1,2],[0,1,-1,2],[0,-1,1,-2],[0,-1,-1,-2]
      ];
      for (const [bc, br, dc, dr] of steps) {
        const nc = col + dc, nr = row + dr;
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
        if (pieceAt(col + bc, row + br, board)) continue;
        const t = pieceAt(nc, nr, board);
        if (!t || t.color === enemy) moves.push({ col: nc, row: nr });
      }
      break;
    }
    case "R": {
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for (const [dc, dr] of dirs) {
        let nc = col + dc, nr = row + dr;
        while (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
          const t = pieceAt(nc, nr, board);
          if (t) {
            if (t.color === enemy) moves.push({ col: nc, row: nr });
            break;
          }
          moves.push({ col: nc, row: nr });
          nc += dc; nr += dr;
        }
      }
      break;
    }
    case "C": {
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for (const [dc, dr] of dirs) {
        let nc = col + dc, nr = row + dr;
        let jumped = false;
        while (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
          const t = pieceAt(nc, nr, board);
          if (!jumped) {
            if (t) jumped = true;
            else moves.push({ col: nc, row: nr });
          } else {
            if (t) {
              if (t.color === enemy) moves.push({ col: nc, row: nr });
              break;
            }
          }
          nc += dc; nr += dr;
        }
      }
      break;
    }
    case "P": {
      if (color === RED) {
        if (row - 1 >= 0) {
          const t = pieceAt(col, row - 1, board);
          if (!t || t.color === enemy) moves.push({ col, row: row - 1 });
        }
        if (!ownHalf(row, color)) {
          for (const dc of [-1, 1]) {
            const nc = col + dc;
            if (nc >= 0 && nc < COLS) {
              const t = pieceAt(nc, row, board);
              if (!t || t.color === enemy) moves.push({ col: nc, row });
            }
          }
        }
      } else {
        if (row + 1 < ROWS) {
          const t = pieceAt(col, row + 1, board);
          if (!t || t.color === enemy) moves.push({ col, row: row + 1 });
        }
        if (!ownHalf(row, color)) {
          for (const dc of [-1, 1]) {
            const nc = col + dc;
            if (nc >= 0 && nc < COLS) {
              const t = pieceAt(nc, row, board);
              if (!t || t.color === enemy) moves.push({ col: nc, row });
            }
          }
        }
      }
      break;
    }
  }
  return moves;
}

function isInCheck(color, board) {
  board = board || pieces;
  const king = board.find(p => p.type === "K" && p.color === color);
  if (!king) return true;
  const enemy = color === RED ? BLACK : RED;
  for (const p of board) {
    if (p.color !== enemy) continue;
    const moves = rawMoves(p, board);
    if (moves.some(m => m.col === king.col && m.row === king.row)) return true;
  }
  return false;
}

function simulateMove(piece, tc, tr, board) {
  board = board || pieces;
  const copy = board.map(p => ({ ...p }));
  const cp = copy.find(p => p.col === piece.col && p.row === piece.row && p.type === piece.type && p.color === piece.color);
  const captured = copy.findIndex(p => p.col === tc && p.row === tr && p !== cp);
  if (captured !== -1) copy.splice(captured, 1);
  cp.col = tc;
  cp.row = tr;
  return copy;
}

function legalMoves(piece, board) {
  board = board || pieces;
  const moves = rawMoves(piece, board);
  return moves.filter(m => {
    const after = simulateMove(piece, m.col, m.row, board);
    return !isInCheck(piece.color, after);
  });
}

function hasAnyLegalMove(color, board) {
  board = board || pieces;
  for (const p of board) {
    if (p.color !== color) continue;
    if (legalMoves(p, board).length > 0) return true;
  }
  return false;
}

function drawBoard() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#e8c882";
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "#5a3e1b";
  ctx.lineWidth = 1.5;

  for (let r = 0; r < ROWS; r++) {
    const y = PAD + r * CELL;
    ctx.beginPath();
    ctx.moveTo(PAD, y);
    ctx.lineTo(PAD + (COLS - 1) * CELL, y);
    ctx.stroke();
  }

  for (let c = 0; c < COLS; c++) {
    const x = PAD + c * CELL;
    if (c === 0 || c === COLS - 1) {
      ctx.beginPath();
      ctx.moveTo(x, PAD);
      ctx.lineTo(x, PAD + (ROWS - 1) * CELL);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(x, PAD);
      ctx.lineTo(x, PAD + 4 * CELL);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, PAD + 5 * CELL);
      ctx.lineTo(x, PAD + 9 * CELL);
      ctx.stroke();
    }
  }

  ctx.beginPath();
  ctx.moveTo(PAD + 3 * CELL, PAD);
  ctx.lineTo(PAD + 5 * CELL, PAD + 2 * CELL);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(PAD + 5 * CELL, PAD);
  ctx.lineTo(PAD + 3 * CELL, PAD + 2 * CELL);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(PAD + 3 * CELL, PAD + 7 * CELL);
  ctx.lineTo(PAD + 5 * CELL, PAD + 9 * CELL);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(PAD + 5 * CELL, PAD + 7 * CELL);
  ctx.lineTo(PAD + 3 * CELL, PAD + 9 * CELL);
  ctx.stroke();

  ctx.save();
  ctx.font = "bold 22px serif";
  ctx.fillStyle = "#5a3e1b";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const riverY = PAD + 4.5 * CELL;
  ctx.fillText("楚 河", PAD + 2 * CELL, riverY);
  ctx.fillText("漢 界", PAD + 6 * CELL, riverY);
  ctx.restore();

  drawStarPoints();
}

function drawStarPoints() {
  const stars = [
    [1,2],[7,2],[0,3],[2,3],[4,3],[6,3],[8,3],
    [1,7],[7,7],[0,6],[2,6],[4,6],[6,6],[8,6]
  ];
  for (const [c, r] of stars) {
    drawStar(PAD + c * CELL, PAD + r * CELL, c, r);
  }
}

function drawStar(x, y, c, r) {
  const s = 5, g = 3;
  ctx.strokeStyle = "#5a3e1b";
  ctx.lineWidth = 1;
  const dirs = [];
  if (c > 0) { dirs.push([-1, -1]); dirs.push([-1, 1]); }
  if (c < 8) { dirs.push([1, -1]); dirs.push([1, 1]); }
  for (const [dx, dy] of dirs) {
    ctx.beginPath();
    ctx.moveTo(x + dx * g, y + dy * g);
    ctx.lineTo(x + dx * g, y + dy * (g + s));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + dx * g, y + dy * g);
    ctx.lineTo(x + dx * (g + s), y + dy * g);
    ctx.stroke();
  }
}

function drawPiece(p, highlight) {
  const { x, y } = toPixel(p.col, p.row);
  const r = PIECE_R;

  ctx.save();
  const grad = ctx.createRadialGradient(x - 3, y - 3, 2, x, y, r);
  grad.addColorStop(0, "#fff8e8");
  grad.addColorStop(1, "#d4a656");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = highlight ? "#ff0" : "#5a3e1b";
  ctx.lineWidth = highlight ? 3 : 2;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.lineWidth = 1;
  ctx.strokeStyle = p.color === RED ? "#c0392b" : "#1a1a1a";
  ctx.beginPath();
  ctx.arc(x, y, r - 4, 0, Math.PI * 2);
  ctx.stroke();

  ctx.font = "bold 22px serif";
  ctx.fillStyle = p.color === RED ? "#c0392b" : "#1a1a1a";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(PIECE_NAMES[p.color][p.type], x, y + 1);
  ctx.restore();
}

function drawMoveHints(moves) {
  for (const m of moves) {
    const { x, y } = toPixel(m.col, m.row);
    const target = pieceAt(m.col, m.row);
    ctx.save();
    if (target) {
      ctx.strokeStyle = "rgba(231,76,60,0.7)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, PIECE_R + 3, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(46,204,113,0.5)";
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawLastMove() {
  if (moveHistory.length === 0) return;
  const last = moveHistory[moveHistory.length - 1];
  ctx.save();
  ctx.strokeStyle = "rgba(52,152,219,0.6)";
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  const from = toPixel(last.fromCol, last.fromRow);
  ctx.beginPath();
  ctx.arc(from.x, from.y, PIECE_R + 2, 0, Math.PI * 2);
  ctx.stroke();
  const to = toPixel(last.toCol, last.toRow);
  ctx.beginPath();
  ctx.arc(to.x, to.y, PIECE_R + 2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function render() {
  drawBoard();
  drawLastMove();
  if (selected && validMoves) drawMoveHints(validMoves);
  for (const p of pieces) {
    drawPiece(p, selected === p);
  }
}

function updateStatus() {
  const el = document.getElementById("status");
  if (gameOver) {
    el.textContent = gameOver;
    el.style.color = "#c0392b";
    return;
  }
  const turnName = turn === RED ? "红方" : "黑方";
  let text = `${turnName}走棋`;
  if (inCheck) text += " —— 将军！";
  el.textContent = text;
  el.style.color = turn === RED ? "#c0392b" : "#1a1a1a";
}

function updateHistory(record) {
  const el = document.getElementById("history");
  const colorName = record.color === RED ? "红" : "黑";
  const pName = PIECE_NAMES[record.color][record.type];
  const colNames = "一二三四五六七八九";
  const fromC = record.color === RED ? 9 - record.fromCol : record.fromCol + 1;
  const toC = record.color === RED ? 9 - record.toCol : record.toCol + 1;
  const fromLabel = colNames[fromC - 1];
  let action, dest;
  if (record.fromRow === record.toRow) {
    action = "平";
    dest = colNames[toC - 1];
  } else if ((record.color === RED && record.toRow < record.fromRow) ||
             (record.color === BLACK && record.toRow > record.fromRow)) {
    action = "进";
    if (record.type === "H" || record.type === "E" || record.type === "A") {
      dest = colNames[toC - 1];
    } else {
      dest = Math.abs(record.toRow - record.fromRow);
    }
  } else {
    action = "退";
    if (record.type === "H" || record.type === "E" || record.type === "A") {
      dest = colNames[toC - 1];
    } else {
      dest = Math.abs(record.toRow - record.fromRow);
    }
  }
  const moveNum = Math.ceil(moveHistory.length / 2);
  const notation = `${pName}${fromLabel}${action}${dest}`;
  el.textContent = `第${moveNum}回合 ${colorName}：${notation}`;
}

function handleClick(e) {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;
  const pos = toBoard(px, py);
  if (!pos) return;

  const clickedPiece = pieceAt(pos.col, pos.row);

  if (selected) {
    if (clickedPiece && clickedPiece.color === turn) {
      selected = clickedPiece;
      validMoves = legalMoves(selected);
      render();
      return;
    }
    const isValid = validMoves.some(m => m.col === pos.col && m.row === pos.row);
    if (isValid) {
      executeMove(selected, pos.col, pos.row);
    } else {
      selected = null;
      validMoves = [];
      render();
    }
    return;
  }

  if (clickedPiece && clickedPiece.color === turn) {
    selected = clickedPiece;
    validMoves = legalMoves(selected);
    render();
  }
}

function executeMove(piece, tc, tr) {
  const captured = pieceAt(tc, tr);
  const record = {
    piece,
    type: piece.type,
    color: piece.color,
    fromCol: piece.col,
    fromRow: piece.row,
    toCol: tc,
    toRow: tr,
    captured: captured ? { ...captured } : null
  };

  if (captured) {
    const idx = pieces.indexOf(captured);
    if (idx !== -1) pieces.splice(idx, 1);
  }
  piece.col = tc;
  piece.row = tr;

  moveHistory.push(record);
  selected = null;
  validMoves = [];

  turn = turn === RED ? BLACK : RED;
  inCheck = isInCheck(turn);

  if (!hasAnyLegalMove(turn)) {
    const winner = turn === RED ? "黑方" : "红方";
    if (inCheck) {
      gameOver = `将死！${winner}胜！`;
    } else {
      gameOver = `困毙！${winner}胜！`;
    }
  }

  updateHistory(record);
  updateStatus();
  render();
}

function undoMove() {
  if (moveHistory.length === 0 || gameOver) return;
  const last = moveHistory.pop();
  last.piece.col = last.fromCol;
  last.piece.row = last.fromRow;
  if (last.captured) {
    pieces.push(last.captured);
  }
  turn = turn === RED ? BLACK : RED;
  inCheck = isInCheck(turn);
  gameOver = null;
  selected = null;
  validMoves = [];
  updateStatus();
  render();
  document.getElementById("history").textContent =
    moveHistory.length > 0 ? "" : "";
  if (moveHistory.length > 0) {
    updateHistory(moveHistory[moveHistory.length - 1]);
  } else {
    document.getElementById("history").textContent = "";
  }
}

function newGame() {
  pieces = INIT_PIECES.map(p => ({ ...p }));
  turn = RED;
  selected = null;
  validMoves = [];
  moveHistory = [];
  gameOver = null;
  inCheck = false;
  document.getElementById("history").textContent = "";
  updateStatus();
  render();
}

canvas.addEventListener("click", handleClick);
newGame();
</script>
</body>
</html>
