<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomoku</title>
  <link rel="stylesheet" href="gomoku.css">
</head>
<body>
  <h1>Gomoku</h1>

  <div id="hud">
    <div class="turn-indicator">
      <span id="player-stone" class="stone-indicator"></span>
      <span id="player-name">Black</span>
    </div>
    <span id="game-message">Black's turn</span>
    <div id="button-area">
      <button id="undo-btn" type="button" disabled>Undo</button>
      <button id="restart-btn" type="button">Restart</button>
    </div>
  </div>

  <div id="board-container"></div>

  <div id="winner-overlay" role="dialog" aria-modal="true" aria-label="Game over">
    <div id="winner-modal">
      <h2>
        <span id="winner-stone" class="stone-indicator" style="display:inline-block;vertical-align:middle;margin-right:8px;width:24px;height:24px;"></span>
        <span id="winner-title">Black Wins!</span>
      </h2>
      <p id="winner-message">Five in a row!</p>
      <button id="modal-restart-btn" type="button">Play Again</button>
    </div>
  </div>

  <script type="module" src="src/gomoku-app.ts"></script>
</body>
</html>
